<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24">
  <!-- Robot head -->
  <rect rx="3" width="24" height="24" fill="#0B79D0"/>
  
  <!-- Left eye -->
  <circle cx="8" cy="8" r="1.5" fill="#fff"/>
  
  <!-- Right eye -->
  <circle cx="16" cy="8" r="1.5" fill="#fff"/>
  
  <!-- Smile mouth -->
  <path d="M 9 14 Q 12 16 15 14" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna left -->
  <line x1="6" y1="2" x2="6" y2="1" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="6" cy="0.5" r="0.4" fill="#FF6B6B"/>
  
  <!-- Antenna right -->
  <line x1="18" y1="2" x2="18" y2="1" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="18" cy="0.5" r="0.4" fill="#FF6B6B"/>
</svg>
